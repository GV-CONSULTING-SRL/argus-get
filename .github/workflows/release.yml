name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      # Client ID della GitHub App "Argus Installer" (variabile di repository, non segreta)
      ARGUS_GH_CLIENT_ID: ${{ vars.ARGUS_GH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add "$TARGET"
      - name: Test
        run: cargo test --locked
      - name: Build
        run: |
          test -n "$ARGUS_GH_CLIENT_ID" || { echo "variabile ARGUS_GH_CLIENT_ID mancante"; exit 1; }
          cargo build --release --locked --target "$TARGET"
          mkdir dist
          cp "target/$TARGET/release/argus-get" dist/argus-get-x86_64-linux-musl
          cp get.sh dist/get.sh
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
