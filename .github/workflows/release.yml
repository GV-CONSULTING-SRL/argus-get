name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# un rilascio alla volta: la cartella di build e' condivisa tra i run
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    env:
      TARGET: x86_64-unknown-linux-musl
      # fuori dal checkout (che viene ripulito): build incrementali tra i rilasci
      CARGO_TARGET_DIR: ${{ github.workspace }}/../cargo-target
      # Client ID della GitHub App "Argus Installer" (variabile di repository, non segreta)
      ARGUS_GH_CLIENT_ID: ${{ vars.ARGUS_GH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Requisiti runner
        run: |
          test -n "$ARGUS_GH_CLIENT_ID" || { echo "::error::variabile ARGUS_GH_CLIENT_ID mancante"; exit 1; }
          command -v musl-gcc >/dev/null || { sudo apt-get update && sudo apt-get install -y musl-tools; }
          command -v gh >/dev/null || { echo "::error::gh (GitHub CLI) non installato sul runner"; exit 1; }
      # stesso profilo e target della build: le dipendenze si compilano una volta sola
      - name: Test
        run: cargo test --release --locked --target "$TARGET"
      - name: Build
        run: |
          cargo build --release --locked --target "$TARGET"
          rm -rf dist && mkdir dist
          cp "$CARGO_TARGET_DIR/$TARGET/release/argus-get" dist/argus-get-x86_64-linux-musl
          cp get.sh dist/get.sh
          cd dist && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
