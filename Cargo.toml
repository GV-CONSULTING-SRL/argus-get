[package]
name = "argus-get"
version = "0.1.0"
edition = "2021"
description = "Installer pubblico di Argus (GV Consulting)"
license = "Proprietary"

[dependencies]
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
